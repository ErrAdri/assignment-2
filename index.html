<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Favorite Music</title>
  <!-- Bootstrap first, so style.css can override it -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header section: unique, so it gets an ID -->
  <header id="site-header" class="text-center py-4">
    <h1>My Favorite Music</h1>
    <nav>
      <a href="index.html" class="btn btn-outline-warning btn-sm mx-1">Home</a>
      <a href="page2.html" class="btn btn-outline-warning btn-sm mx-1">Page 2</a>
    </nav>
  </header>

  <!-- Bootstrap container centers the content and adds side padding -->
  <main class="container py-4">
    <!-- Bootstrap grid: two columns on tablets and up, stacked on phones -->
    <div class="row g-4">

      <div class="col-md-6">
        <section id="songs" class="music-card h-100">
          <h2 class="section-title">Top Songs</h2>
          <ul>
            <li>Song One</li>
            <li>Song Two</li>
          </ul>
        </section>
      </div>

      <div class="col-md-6">
        <section id="albums" class="music-card h-100">
          <h2 class="section-title">Top Albums</h2>
          <img src="images/album1.svg" alt="Album cover" class="img-fluid rounded d-block mx-auto w-50 mb-3">
          <p>A short description of the album.</p>
        </section>
      </div>

    </div>
  </main>

  <!-- Footer: unique, so it gets an ID -->
  <footer id="site-footer" class="text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 My Music Site</p>
  </footer>
</body>
</html>
